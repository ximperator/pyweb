apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyweb
spec:
  ingressClassName: nginx
  rules:
    - host: pyweb.minikube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyweb
                port:
                  number: 80
